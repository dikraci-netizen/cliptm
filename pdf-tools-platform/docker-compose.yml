version: '3.8'

services:
  pdf-tools-pro:
    build: .
    container_name: pdf-tools-pro
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_CONCURRENT_JOBS=5
    volumes:
      - uploads:/app/backend/uploads
      - temp:/app/backend/temp
      - output:/app/backend/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
  temp:
  output:
