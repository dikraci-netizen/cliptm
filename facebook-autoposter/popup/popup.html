<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Auto Poster Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="12" fill="#1877F2"/>
          <path d="M16.5 12.5h-2.5v7h-3v-7h-2v-2.5h2v-1.5c0-2.2 1-3.5 3.5-3.5h2v2.5h-1.5c-.8 0-1 .3-1 1v1.5h2.5l-.5 2.5z" fill="white"/>
        </svg>
        <h1>Auto Poster <span class="pro-badge">PRO</span></h1>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text">Inactif</span>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="compose">Composer</button>
      <button class="tab" data-tab="schedule">Programmer</button>
      <button class="tab" data-tab="history">Historique</button>
      <button class="tab" data-tab="settings">Params</button>
    </nav>

    <!-- Compose Tab -->
    <section class="tab-content active" id="compose">
      <div class="form-group">
        <label for="postContent">Contenu du post</label>
        <textarea id="postContent" placeholder="Ecrivez votre publication ici..." rows="5"></textarea>
        <div class="char-count"><span id="charCount">0</span> caracteres</div>
      </div>

      <div class="form-group">
        <label for="postTarget">Publier sur</label>
        <select id="postTarget">
          <option value="timeline">Mon profil</option>
          <option value="page">Ma page</option>
          <option value="group">Un groupe</option>
        </select>
      </div>

      <div class="form-group">
        <label for="targetUrl">URL de destination (optionnel)</label>
        <input type="url" id="targetUrl" placeholder="https://www.facebook.com/groups/...">
      </div>

      <div class="form-group">
        <label>Options</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="addEmoji"> Ajouter des emojis
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="addHashtags"> Ajouter des hashtags
          </label>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="publishNow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
          Publier maintenant
        </button>
        <button class="btn btn-secondary" id="addToSchedule">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
          </svg>
          Programmer
        </button>
      </div>
    </section>

    <!-- Schedule Tab -->
    <section class="tab-content" id="schedule">
      <div class="schedule-form">
        <div class="form-group">
          <label for="scheduleDate">Date</label>
          <input type="date" id="scheduleDate">
        </div>
        <div class="form-group">
          <label for="scheduleTime">Heure</label>
          <input type="time" id="scheduleTime">
        </div>
        <div class="form-group">
          <label for="repeatOption">Repetition</label>
          <select id="repeatOption">
            <option value="none">Aucune</option>
            <option value="daily">Quotidienne</option>
            <option value="weekly">Hebdomadaire</option>
            <option value="monthly">Mensuelle</option>
          </select>
        </div>
      </div>

      <div class="scheduled-posts" id="scheduledPosts">
        <h3>Posts programmes</h3>
        <div class="empty-state" id="emptySchedule">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          <p>Aucun post programme</p>
        </div>
        <div class="posts-list" id="scheduleList"></div>
      </div>
    </section>

    <!-- History Tab -->
    <section class="tab-content" id="history">
      <div class="history-stats">
        <div class="stat-card">
          <span class="stat-number" id="totalPosts">0</span>
          <span class="stat-label">Total posts</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="successPosts">0</span>
          <span class="stat-label">Reussis</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="failedPosts">0</span>
          <span class="stat-label">Echoues</span>
        </div>
      </div>
      <div class="posts-list" id="historyList">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p>Aucun historique</p>
        </div>
      </div>
    </section>

    <!-- Settings Tab -->
    <section class="tab-content" id="settings">
      <div class="form-group">
        <label for="delayMin">Delai minimum entre posts (minutes)</label>
        <input type="number" id="delayMin" value="5" min="1" max="60">
      </div>
      <div class="form-group">
        <label for="delayMax">Delai maximum entre posts (minutes)</label>
        <input type="number" id="delayMax" value="15" min="1" max="120">
      </div>
      <div class="form-group">
        <label>Comportement</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="randomDelay" checked> Delai aleatoire entre actions
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="notifySuccess" checked> Notification de succes
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="notifyError" checked> Notification d'erreur
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="autoRetry"> Reessayer automatiquement en cas d'echec
          </label>
        </div>
      </div>
      <div class="form-group">
        <label for="maxRetries">Nombre max de tentatives</label>
        <input type="number" id="maxRetries" value="3" min="1" max="10">
      </div>
      <button class="btn btn-primary" id="saveSettings">Sauvegarder les parametres</button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span>Facebook Auto Poster Pro v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
